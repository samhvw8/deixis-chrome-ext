name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # wxt.config.ts runs `git describe --tags` for __GIT_VERSION__; the
          # default shallow clone fetches no tags, degrading it to a bare SHA.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run compile

      - name: Test
        run: bun run test

      - name: Build & zip
        run: bun run zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deixis-chrome-${{ github.sha }}
          path: .output/*-chrome.zip
          # WXT writes to .output, and upload-artifact treats any path under a
          # dot-directory as hidden and silently skips it. Without this the step
          # fails with "No files were found" even though the zip exists.
          include-hidden-files: true
          if-no-files-found: error
